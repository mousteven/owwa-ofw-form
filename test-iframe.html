<!doctype html><html><body>
<iframe name="relay" style="display:none"></iframe>
<script>
function addField(form, name, value){
  const input = document.createElement('input');
  input.type = 'hidden';
  input.name = name;
  input.value = value;
  form.appendChild(input);
}
const form = document.createElement('form');
form.action = 'https://api.web3forms.com/submit';
form.method = 'POST';
form.enctype = 'multipart/form-data';
form.target = 'relay';
addField(form, 'access_key', '64820118-cdb6-4b6a-b298-f2f0438ca604');
addField(form, 'subject', 'Iframe form-post test');
addField(form, 'Test Field', 'hello via iframe post');
document.body.appendChild(form);

const iframe = document.querySelector('iframe[name="relay"]');
iframe.addEventListener('load', () => {
  console.log('iframe loaded after submit, attempt to read content (may fail due to cross-origin, thats OK)');
  try {
    console.log('iframe body text:', iframe.contentDocument.body.innerText.slice(0,300));
  } catch (e) {
    console.log('cannot read iframe content (expected if cross-origin):', e.message);
  }
});
form.submit();
console.log('form submitted');
</script>
</body></html>
